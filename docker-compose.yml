version: "3.8"

# =============================================================================
# EEDC Community - Docker Compose
# =============================================================================
#
# Image wird automatisch von GitHub Actions gebaut und auf Docker Hub gepusht.
#
# Deployment:
# 1. In Portainer: Stack erstellen mit "Web editor"
# 2. Diese Datei einfügen
# 3. Environment Variables setzen:
#    - POSTGRES_PASSWORD: <sicheres Passwort>
#    - SECRET_KEY: <zufälliger String>
#    - ALLOWED_ORIGINS: https://energy.raunet.eu
#
# Update: docker compose pull && docker compose up -d
# =============================================================================

services:
  api:
    image: supernova1963/eedc-community:latest
    container_name: eedc-community-api
    restart: unless-stopped
    # ⚑ 2026-09-16: Hier stand `ports: ["8099:8080"]` — der Notbehelf vom 08.09., und
    # darueber eine Begruendung, die WIDERLEGT ist. Sie lautete: "NPM laeuft auf dem
    # System-Daemon, dieser Stack auf dem Snap-Daemon -- ueber ein Container-Netz koennen
    # sich beide grundsaetzlich nicht erreichen."
    #
    # Der Doppel-Daemon wurde am 16.09. beseitigt (`snap remove docker`) — und der Fehler
    # BLIEB. Gemessen im NPM-Container, gleicher Moment, gleiches Ziel:
    #     altes Netz 172.18.0.3:8080 -> 000   (ARP-Flags 0x0, MAC 00:00:00:00:00:00)
    #     neues Netz 172.19.0.3:8080 -> 200   (ARP-Flags 0x2)
    # Der Unterschied war das Erstellungsdatum: `nginxproxymanager_default` stammte vom
    # 2023-08-12 und trug nach mehreren Docker-Hauptversionen nicht mehr. Der Host-Port
    # umging also nicht die Daemon-Grenze, sondern das kaputte Netz.
    #
    # ⭐ Seit dem Netz-Umbau erreicht der Proxy die API ueber `eedc-community-api:8080`.
    # Der veroeffentlichte Port ist damit ueberfluessig — und er war eine offene Flanke:
    # die API antwortete auf 192.168.1.3:8099 OHNE TLS.
    environment:
      - DATABASE_URL=postgresql+asyncpg://eedc:${POSTGRES_PASSWORD}@db:5432/eedc_community
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://energy.raunet.eu}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - proxy

  db:
    image: postgres:16-alpine
    container_name: eedc-community-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=eedc
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=eedc_community
    volumes:
      - eedc_community_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eedc -d eedc_community"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  eedc_community_postgres:

networks:
  internal:
    driver: bridge
  # ⚑ Seit 2026-09-16 statt `nginxproxymanager_default` (s. Kommentar bei `ports`).
  # Einmalig von Hand angelegt: `docker network create proxy`. Bewusst KEIN
  # Compose-Default-Netz: dessen Name waere `<projektname>_default` und zeigte nach einer
  # Stack-Umbenennung ins Leere -- genau die Kopplung, die den 08.09. mitverursacht hat.
  proxy:
    external: true
